<style>
:root{--bg:#eef5ff;--surf:#fff;--surf2:#e2eeff;--line:#c4d9f5;--tx:#0a2342;--mut:#5a7396;--ac:#0a84ff;--ac2:#00c2ff;--glow:rgba(10,132,255,.16);--ok:#00a37f;--bad:#e5384f;--bd:1px solid var(--line);--fx:none;--lr:0 0 0 2px var(--ac2);--fa1:#22e1ff;--fa2:#0a84ff;--fi1:#c3cddb;--fi2:#7a879b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050d1f;--surf:#0b1a36;--surf2:#10264d;--line:#1b3a6b;--tx:#e6f1ff;--mut:#7f9cc7;--ac:#2d9bff;--ac2:#22e1ff;--glow:rgba(34,225,255,.18);--ok:#2ee6b6;--bad:#ff6b81;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050d1f;--surf:#0b1a36;--surf2:#10264d;--line:#1b3a6b;--tx:#e6f1ff;--mut:#7f9cc7;--ac:#2d9bff;--ac2:#22e1ff;--glow:rgba(34,225,255,.18);--ok:#2ee6b6;--bad:#ff6b81;color-scheme:dark}
*{box-sizing:border-box;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Onest,system-ui,sans-serif;min-height:100vh;background-image:linear-gradient(var(--glow) 1px,transparent 1px),linear-gradient(90deg,var(--glow) 1px,transparent 1px);background-size:36px 36px;background-attachment:fixed}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--surf);border-bottom:var(--bd)}
.brand{display:flex;align-items:center;gap:12px;font-family:Unbounded,sans-serif;font-weight:600;font-size:1rem}
.pfp{position:relative;width:42px;height:42px;padding:0;border:0;background:none;cursor:pointer;border-radius:12px;flex:none}
.pfp img{width:100%;height:100%;border-radius:12px;object-fit:cover;box-shadow:var(--lr);display:block}
.avbig{width:120px;height:120px;margin:0 auto 14px}
.avbig img{width:100%;height:100%;border-radius:26px;object-fit:cover;box-shadow:var(--lr)}
main{max-width:680px;margin:0 auto;padding:18px 16px 108px}
h1,h2{font-family:Unbounded,Onest,sans-serif;font-weight:600;margin:0}
h1{font-size:1.4rem;line-height:1.2}
h2{font-size:.92rem;margin:26px 0 10px;color:var(--ac)}
.sub{color:var(--mut);margin:4px 0 16px}
.bar{height:8px;border-radius:8px;background:var(--surf2);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:8px;transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 4px}
.stat{background:var(--surf);border:var(--bd);border-radius:12px;padding:10px 12px}
.stat b{font-family:Unbounded,sans-serif;font-size:1.1rem;color:var(--ac)}
.stat b.p{color:var(--ok)}.stat b.n{color:var(--bad)}
.stat span{display:block;color:var(--mut);font-size:.78rem}
.item{display:flex;align-items:flex-start;gap:12px;background:var(--surf);border:var(--bd);border-radius:12px;padding:11px 12px;margin-bottom:8px}
.item.done .t{opacity:.5;text-decoration:line-through}
.item.aff{border-left:3px solid var(--ac2)}
.t{flex:1;min-width:0;overflow-wrap:anywhere;outline:none}
.meta{color:var(--mut);font-size:.78rem}
.tm{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:600;min-width:46px}
*{scrollbar-width:none}
*::-webkit-scrollbar,html::-webkit-scrollbar{display:none;width:0;height:0}
.fl{display:flex;align-items:center;gap:3px;flex:none;font-weight:700;font-size:.8rem;color:var(--mut);white-space:nowrap}
.fl svg{width:22px;height:22px;fill:url(#fg2);stroke:var(--mut);stroke-opacity:.5;stroke-width:.5}
.fl.on{color:var(--tx)}
.fl.on svg{fill:url(#fg);filter:drop-shadow(0 0 5px var(--fa2))}
.fl.zero{opacity:.4}
.fl.pop svg{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
.item,.form,.stat,.curve,.mi,.cell{box-shadow:var(--fx)}
.modal>.set{max-width:420px;max-height:92vh;overflow:auto}
.set h2{margin:20px 0 8px}
.swr{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0}
.sw.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--ac2)}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.th{background:var(--surf2);border:var(--bd);border-radius:10px;padding:6px;cursor:pointer;font-size:.8rem}
.th.on{outline:2px solid var(--ac2)}
.th i{display:block;height:30px;border-radius:7px;margin-bottom:4px;border:2px solid var(--ac)}
.item.cur{border-color:var(--ac2);box-shadow:0 0 0 1px var(--ac2)}
.rng{font-variant-numeric:tabular-nums;color:var(--ac);font-weight:600;min-width:96px;font-size:.88rem}
.chk{width:24px;height:24px;flex:none;border:2px solid var(--ac);border-radius:7px;background:transparent;cursor:pointer;display:grid;place-items:center;color:#031326;padding:0}
.chk.on{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.chk.on::after{content:"✓";font-size:15px;font-weight:700}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:1.2rem;padding:0 4px;line-height:1}
.x:hover{color:var(--bad)}
button,input,textarea,select{font:inherit;color:inherit}
input,textarea,select{width:100%;background:var(--surf);border:var(--bd);border-radius:12px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus,button:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
textarea{resize:vertical;min-height:84px}
.btn{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#031326;border:0;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.alt{background:var(--surf2);color:var(--tx);border:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.row>*{flex:1;min-width:110px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{flex:1;min-width:44px;background:var(--surf);border:var(--bd);border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#031326;font-weight:600}
.chip.now{box-shadow:0 0 0 2px var(--ac2)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cell{border-radius:10px;border:var(--bd);text-align:center;padding:8px 0;background:var(--surf)}
.cell small{display:block;color:var(--mut);font-size:.72rem}
.form{background:var(--surf);border:var(--bd);border-radius:14px;padding:12px}
.empty{color:var(--mut);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
details{margin-bottom:8px}
summary{cursor:pointer;font-weight:600;padding:10px 12px;background:var(--surf);border:var(--bd);border-radius:12px;margin-bottom:8px}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.trade{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:center}
.curve{background:var(--surf);border:var(--bd);border-radius:14px;padding:8px}
.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mi{background:var(--surf);border:var(--bd);border-radius:12px;overflow:hidden;position:relative}
.mi img,.mi video{width:100%;height:130px;object-fit:cover;display:block;cursor:zoom-in;background:#000}
.mi p{margin:0;padding:6px 8px;font-size:.78rem;color:var(--mut);overflow-wrap:anywhere}
.mi .x{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);color:#fff;border-radius:8px;padding:2px 7px}
.modal{position:fixed;inset:0;background:rgba(2,8,20,.78);z-index:20;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--surf);border:var(--bd);border-radius:16px;padding:18px;width:100%;max-width:380px}
.modal.big>div{max-width:96vw;background:transparent;border:0;padding:0}
.modal.big img,.modal.big video{max-width:96vw;max-height:84vh;display:block;margin:auto;border-radius:12px}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--fa2)"/><stop offset="1" style="stop-color:var(--fa1)"/></linearGradient><linearGradient id="fg2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--fi2)"/><stop offset="1" style="stop-color:var(--fi1)"/></linearGradient></defs></svg>
<header><div class="brand"><button class="pfp" data-a="prof" aria-label="Настройки"><img id="pfp" alt="Логотип"></button><span>Мой план</span></div></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="modal"></div>
<script>
const DAYS=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const KEY='planner.v2';
const AFF=`думай о настоящем
я великий трейдер.
я успешный трейдер.
я прибыльный трейдер.
я спортивный человек.
я ментально счастлив.
я ментально сильный.
я уверенный человек.
у меня есть дисциплина.
я не зависимый.
у меня нет зависимости.
я высокий.
у меня есть феррари.
я люблю все что я делаю.
я добился своих целей.
я богатый.
я знаю английский.
Я спокойно и уверенно иду к своим целям.
У меня достаточно времени на все важное.
чужое мнение не определяет мою ценность.
неудача не определяет мою ценность.
главное что бы мне нравилось.
я здесь не ради одобрения.
я здесь,что бы окупить следующий уровень.
да, мне страшно и я все равно иду.
это воспоминание, а не предсказание.
я пришел, не смотря на страх?
мне не нужно что то кому то доказывать.
я не обсуждаю с собой то, что уже решил.
не зацикливайся на том чего не можешь изменить.
Если увидят - хорошо. Если нет - моя цель от этого не меняется.`.split('\n');
const WISH='подписки каждый месяц|антиперспирант|парфюм|кариес|зимняя куртка|клоуд pro|stream камера|новый тел|штучки пк (аксессуар клавы)|одежда|зимняя обувь тимберленд|электровело (летом)|арабский халат|скрывающая шапка|колонка компу|зарядка|джойстик ps5|bluetooth device|fake tattoos|аксессуары|штучка для отжимания|второй повербанк|шахматы королевские|световой меч|мелатонин|зеленые линзы|веснушки|зеленый led колпачок'.split('|');
const TR=[[84,'TP','TP1 ×0.04',336],[51,'SL','SL ×0.08',-380],[75,'SL','SL ×0.08',-600],[67,'SL','SL ×0.08',-536],[163,'TP','TP2',970],[119,'TP','TP2',720],[79,'SL','SL ×0.08',-630],[184,'TP','TP1',1450],[271,'TP','TP1 ×0.02',542],[91,'SL','SL ×0.04',-364],[187,'SL','SL ×0.02',-374],[235,'SL','SL ×0.02',-470],[143,'SL','SL ×0.04',-572],[278,'TP','TP1 ×0.01',278],[243,'TP','TP1 ×0.01',243],[410,'TP','TP1 ×0.01',410]];
const uid=()=>Math.random().toString(36).slice(2,9);
const HAB=['английский','system','daytrading','доставка','голос','витамины','сон','chess','думай о настоящем, не переживай о будущем и прошлом','брови ресницы','аффирмации'];
const BLK=[['08:30','10:00','Помыться, тренировка, похавать, убраться'],['10:00','20:00','Работа, голос'],['20:30','00:00','Английский, внутренний мир, похавать']];
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){S={notes:[],done:{},affDone:{},
 aff:AFF.map(t=>({id:uid(),text:t})),
 wish:WISH.map(n=>({id:uid(),name:n,price:'',got:false})),
 trades:TR.map((r,i)=>({id:uid(),date:'',inst:'NQ',pts:r[0],res:r[1],note:r[2],pnl:r[3],ts:i})),
 rules:['Использовать volume profile.','Входить по тренду, а не на снятии ликвидности.'].map(t=>({id:uid(),text:t})),
 prof:{avatar:''}}}
if(!S.habits){/* перенос из версии, где трекер и график были вместе */
 const old=S.sch||[],ends={'08:30':'10:00','10:00':'20:00','20:30':'00:00'};
 S.habits=old.length?old.filter(s=>!s.time).map(s=>({id:s.id,title:s.title})):HAB.map(t=>({id:uid(),title:t}));
 S.blocks=old.length?old.filter(s=>s.time).map(s=>({id:s.id,start:s.time,end:ends[s.time]||'',title:s.title,days:s.days})):BLK.map(b=>({id:uid(),start:b[0],end:b[1],title:b[2],days:[0,1,2,3,4,5,6]}));
 if(old.length)HAB.forEach(t=>{if(!S.habits.some(h=>h.title.toLowerCase()===t))S.habits.push({id:uid(),title:t})});
 delete S.sch}
S.prof=S.prof||{avatar:''};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Не хватает места в браузере для сохранения.')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=id=>document.getElementById(id);
const dkey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const wd=d=>(d.getDay()+6)%7;
const money=n=>(n<0?'−':n>0?'+':'')+'$'+Math.abs(Math.round(n*100)/100).toLocaleString('ru-RU');
let tab='today',selDay=wd(new Date()),filter='all',formDays=null,affOpen=false,wf='all';
const TABS=[['today','◈','Сегодня'],['track','☑','Трекер'],['sched','◷','Расписание'],['aff','✦','Аффирм.'],['notes','✎','Заметки'],['trades','◭','Трейды'],['strat','⌘','Стратегия'],['wish','★','Хотелки']];

/* IndexedDB для фото и видео */
let dbp;const db=()=>dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('planner-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const mdo=async(mode,fn)=>{const d=await db();return new Promise((res,rej)=>{const t=d.transaction('m',mode),s=t.objectStore('m'),q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const mAll=()=>mdo('readonly',s=>s.getAll()),mPut=o=>mdo('readwrite',s=>s.put(o)),mDel=id=>mdo('readwrite',s=>s.delete(id));
const readURL=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});

const hmin=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
function blocksFor(i){return S.blocks.filter(b=>b.days.includes(i)).sort((a,b)=>a.start.localeCompare(b.start))}
function isNow(b,i){const n=new Date();if(i!==wd(n))return false;const m=n.getHours()*60+n.getMinutes(),s=hmin(b.start);let e=b.end?hmin(b.end):s+1;if(e<=s)e+=1440;return m>=s&&m<e}
function blockRow(b,i,del){const now=isNow(b,i);return `<div class="item ${now?'cur':''}"><span class="rng">${b.start}${b.end?'–'+b.end:''}</span><span class="t" ${del?`contenteditable="true" data-a="bedit" data-id="${b.id}"`:''}>${esc(b.title)}</span>${now?'<span class="meta">сейчас</span>':''}${del?`<button class="x" data-a="bdel" data-id="${b.id}" aria-label="Удалить">×</button>`:''}</div>`}
const FL='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.48 12.35c-1.57-4.08-7.16-4.3-5.81-10.23.1-.44-.37-.78-.75-.55C9.29 3.71 6.68 8 8.87 13.62c.18.46-.36.89-.75.59-1.81-1.37-2-3.34-1.84-4.75.06-.52-.62-.77-.91-.34C4.69 10.16 4 11.84 4 14.37c.38 5.6 5.11 7.32 6.81 7.54 2.43.31 5.06-.14 6.95-1.87 2.08-1.93 2.84-5.01 1.72-7.69z"/></svg>';
function streak(id){const d=new Date(),t=(S.done[dkey(d)]||[]).includes(id);let n=0;if(!t)d.setDate(d.getDate()-1);while((S.done[dkey(d)]||[]).includes(id)){n++;d.setDate(d.getDate()-1)}return{n,t}}
let popId=null;
function flame(id){const s=streak(id),c=s.t&&s.n?'on':s.n?'':'zero',p=popId===id&&s.t?' pop':'';return `<span class="fl ${c}${p}" title="Серия дней подряд">${FL}${s.n}${cfg('days')?' дн.':''}</span>`}
function habRow(h,k,edit){const on=(S.done[k]||[]).includes(h.id);
 return `<div class="item ${on?'done':''}"><button class="chk ${on?'on':''}" data-a="hdone" data-id="${h.id}" data-k="${k}" aria-label="Отметить"></button><span class="t" ${edit?`contenteditable="true" data-a="hedit" data-id="${h.id}"`:`data-a="hdone" data-id="${h.id}" data-k="${k}"`}>${esc(h.title)}</span>${flame(h.id)}${edit?`<button class="x" data-a="hdel" data-id="${h.id}" aria-label="Удалить">×</button>`:''}</div>`}
function composer(){return `<div class="form"><textarea id="nt" placeholder="Мысль или то, что нельзя забыть…"></textarea><div class="row"><button class="btn" data-a="nadd" data-todo="0">Сохранить заметку</button><button class="btn alt" data-a="nadd" data-todo="1">Добавить как задачу</button></div></div>`}
function noteRow(n){const dt=new Date(n.ts).toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
 return `<div class="item ${n.done?'done':''}">${n.todo?`<button class="chk ${n.done?'on':''}" data-a="ndone" data-id="${n.id}" aria-label="Выполнено"></button>`:'<span class="tm">✎</span>'}<span class="t">${esc(n.text).replace(/\n/g,'<br>')}<span class="meta"><br>${n.todo?'Задача':'Заметка'} · ${dt}</span></span><button class="x" data-a="ndel" data-id="${n.id}" aria-label="Удалить">×</button></div>`}

function vToday(){
 const d=new Date(),k=dkey(d),i=wd(d),H=S.habits,hd=(S.done[k]||[]).filter(x=>H.some(h=>h.id===x)).length,ad=(S.affDone[k]||[]).filter(x=>S.aff.some(a=>a.id===x)).length;
 const tot=H.length+S.aff.length,p=tot?Math.round((hd+ad)/tot*100):0,open=S.notes.filter(n=>n.todo&&!n.done),bl=blocksFor(i);
 const date=d.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
 return `<h1>${esc(date)}</h1><p class="sub">Прогресс дня: ${p}%</p><div class="bar"><i style="width:${p}%"></i></div>
 <div class="stats"><div class="stat"><b>${hd}/${H.length}</b><span>трекер</span></div><div class="stat"><b>${ad}/${S.aff.length}</b><span>аффирмации</span></div><div class="stat"><b>${open.length}</b><span>открытых задач</span></div></div>
 <h2>Трекер</h2>${H.map(h=>habRow(h,k)).join('')||'<div class="empty">Добавьте пункты во вкладке «Трекер».</div>'}
 <h2>Расписание на сегодня</h2>${bl.length?bl.map(b=>blockRow(b,i)).join(''):'<div class="empty">На сегодня блоков нет.</div>'}
 <h2>Аффирмации</h2><details id="affd" ${affOpen?'open':''}><summary>Прочитано ${ad} из ${S.aff.length}</summary>${S.aff.map(a=>{const on=(S.affDone[k]||[]).includes(a.id);return `<div class="item aff ${on?'done':''}"><button class="chk ${on?'on':''}" data-a="adone" data-id="${a.id}" aria-label="Прочитано"></button><span class="t">${esc(a.text)}</span></div>`}).join('')}</details>
 ${open.length?`<h2>Не забыть</h2>${open.slice(0,5).map(noteRow).join('')}`:''}
 <h2>Новая запись</h2>${composer()}`}

function vSched(){
 if(!formDays)formDays=[selDay];const now=new Date(),list=blocksFor(selDay);
 return `<h1>Расписание</h1><p class="sub">Блоки времени на день. Нажмите на текст, чтобы изменить.</p>
 <div class="chips">${DAYS.map((n,i)=>`<button class="chip ${i===selDay?'on':''} ${i===wd(now)?'now':''}" data-a="sday" data-i="${i}">${n}</button>`).join('')}</div>
 <h2>${DAYS[selDay]}</h2>${list.length?list.map(b=>blockRow(b,selDay,true)).join(''):'<div class="empty">Пока пусто.</div>'}
 <h2>Новый блок</h2><div class="form"><div class="row" style="margin-top:0"><input type="time" id="bs" aria-label="Начало"><input type="time" id="be" aria-label="Конец"></div><input id="bt" placeholder="Что делать" style="margin-top:8px">
 <div class="chips" style="margin-top:8px">${DAYS.map((n,i)=>`<button class="chip ${formDays.includes(i)?'on':''}" data-a="fday" data-i="${i}">${n}</button>`).join('')}</div>
 <div class="row"><button class="btn" data-a="badd">Добавить блок</button></div></div>`}
let editH=false;
function vTrack(){
 const now=new Date(),k=dkey(now),H=S.habits,cnt=d=>(S.done[dkey(d)]||[]).filter(x=>H.some(h=>h.id===x)).length,hd=cnt(now),p=H.length?Math.round(hd/H.length*100):0;
 const mon=new Date(now);mon.setDate(now.getDate()-wd(now));let wk='';
 for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);const dn=cnt(d),q=H.length?dn/H.length:0;wk+=`<div class="cell" style="background:rgba(10,132,255,${(q*.55).toFixed(2)})"><small>${DAYS[i]}</small><b>${dn}/${H.length}</b></div>`}
 return `<h1>Трекер</h1><p class="sub">Сегодня выполнено ${hd} из ${H.length}. Отметки сбрасываются каждый день.</p><div class="bar"><i style="width:${p}%"></i></div>
 <h2>Неделя</h2><div class="week">${wk}</div>
 <h2>Сегодня</h2>${H.map(h=>habRow(h,k,editH)).join('')||'<div class="empty">Список пуст. Добавьте первый пункт.</div>'}
 <div class="row"><button class="btn alt" data-a="hmode">${editH?'Готово':'Изменить список'}</button></div>
 <h2>Новый пункт</h2><div class="form"><input id="ht" placeholder="Например: чтение 20 минут"><div class="row"><button class="btn" data-a="hadd">Добавить в трекер</button></div></div>`}

function vAff(){return `<h1>Аффирмации</h1><p class="sub">Нажмите на текст, чтобы изменить. Отмечать прочтение можно на экране «Сегодня».</p>
 ${S.aff.length?S.aff.map(a=>`<div class="item aff"><span class="t" contenteditable="true" data-a="aedit" data-id="${a.id}">${esc(a.text)}</span><button class="x" data-a="adel" data-id="${a.id}" aria-label="Удалить">×</button></div>`).join(''):'<div class="empty">Пока нет аффирмаций.</div>'}
 <h2>Новая аффирмация</h2><div class="form"><textarea id="at" placeholder="Например: я справляюсь с любыми задачами"></textarea><div class="row"><button class="btn" data-a="aadd">Добавить</button></div></div>`}

function vNotes(){
 const L=S.notes.filter(n=>filter==='all'||(filter==='todo'?n.todo:!n.todo)).sort((a,b)=>b.ts-a.ts);
 return `<h1>Заметки</h1><p class="sub">Мысли и задачи, которые нельзя забыть</p>${composer()}
 <div class="chips" style="margin-top:16px">${[['all','Все'],['todo','Задачи'],['note','Заметки']].map(([v,n])=>`<button class="chip ${filter===v?'on':''}" data-a="filt" data-v="${v}">${n}</button>`).join('')}</div>
 <h2>Записи</h2>${L.length?L.map(noteRow).join(''):'<div class="empty">Здесь пока ничего нет.</div>'}`}

function stats(){
 const T=[...S.trades].sort((a,b)=>a.ts-b.ts),p=T.map(t=>+t.pnl||0);
 const W=p.filter(x=>x>0),L=p.filter(x=>x<0),gw=W.reduce((a,b)=>a+b,0),gl=-L.reduce((a,b)=>a+b,0);
 let eq=0,pk=0,dd=0,cw=0,cl=0,mw=0,ml=0;const curve=[0];
 p.forEach(x=>{eq+=x;curve.push(eq);pk=Math.max(pk,eq);dd=Math.max(dd,pk-eq);if(x>0){cw++;cl=0}else if(x<0){cl++;cw=0}else{cw=0;cl=0}mw=Math.max(mw,cw);ml=Math.max(ml,cl)});
 const aw=W.length?gw/W.length:0,al=L.length?gl/L.length:0,dec=W.length+L.length;
 return {n:T.length,net:eq,wr:dec?W.length/dec*100:0,pf:gl?gw/gl:(gw?Infinity:0),aw,al,rr:al?aw/al:0,exp:T.length?eq/T.length:0,dd,best:Math.max(0,...p),worst:Math.min(0,...p),mw,ml,pts:T.reduce((a,t)=>a+(t.res==='SL'?-t.pts:t.res==='TP'?+t.pts:0),0),curve,T}}
function vTrades(){
 const s=stats(),c=s.curve,W=600,H=170,mn=Math.min(0,...c),mx=Math.max(0,...c),r=(mx-mn)||1;
 const X=i=>10+i*(W-20)/Math.max(1,c.length-1),Y=v=>H-12-(v-mn)/r*(H-24);
 const pts=c.map((v,i)=>X(i)+','+Y(v)).join(' ');
 const cls=v=>v>0?'p':v<0?'n':'';
 const rows=[...s.T].reverse().map(t=>`<div class="item trade"><span class="meta">#${s.T.indexOf(t)+1}</span><span class="t">${esc(t.inst)} · ${esc(t.note||t.res)}<span class="meta"><br>${t.pts} п.${t.date?' · '+esc(t.date):''}</span></span><span class="${t.pnl>0?'pos':t.pnl<0?'neg':''}">${money(t.pnl)}</span><button class="x" data-a="trdel" data-id="${t.id}" aria-label="Удалить">×</button></div>`).join('');
 return `<h1>Журнал трейдов</h1><p class="sub">Статистика пересчитывается при каждой записи</p>

 <h2>Кривая капитала</h2><div class="curve"><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Кривая капитала"><line x1="10" x2="${W-10}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)" stroke-dasharray="4 4"/><polyline points="${pts}" fill="none" stroke="var(--ac2)" stroke-width="2.5" stroke-linejoin="round"/></svg></div>

document.addEventListener('toggle',e=>{if(e.target.id==='affd')affOpen=e.target.open},true);
document.addEventListener('change',async e=>{
 if(e.target.id==='pf'&&e.target.files[0]){try{S.prof.avatar=await toAvatar(e.target.files[0]);save();setPfp();$('modal').innerHTML=''}catch(x){}}
 if(e.target.id==='imp'&&e.target.files[0]){await onImport(e.target.files[0])}
 if(e.target.id==='mf'){const cap=$('mcap').value.trim();try{for(const f of e.target.files){await mPut({id:uid(),name:f.name,type:f.type,cap,ts:Date.now(),data:await readURL(f)})}}catch(x){alert('Не удалось сохранить файл: '+x)}e.target.value='';loadMedia()}});
["gesturestart","gesturechange","gestureend"].forEach(g=>document.addEventListener(g,e=>e.preventDefault()));
seed1();applyTheme();setPfp();render();
</script>
</body>
</html>
